name: openspec-workflow
version: 4
description: Custom workflow schema for openspec-workflow
artifacts:
  - id: proposal
    generates: proposal.md
    description: High-level description of the change, its motivation, and scope
    template: proposal.md
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications with requirements and scenarios
    template: specs/spec.md
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design decisions and implementation approach
    template: design.md
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    requires:
      - specs
      - design
  - id: plan-review
    generates: plan-review.md
    description: Independent review of proposal, specs, design, and tasks before implementation
    template: plan-review.md
    requires:
      - tasks
  - id: verification
    generates: verify.md
    description: Verification of the implementation
    template: verify.md
    requires:
      - plan-review
apply:
  requires:
    - tasks
    - plan-review
  tracks: tasks.md